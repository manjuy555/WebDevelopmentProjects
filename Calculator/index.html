<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="icon/img" href="/assets/calculator-solid.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body>
    <div class="calc">
      <div style="text-transform: uppercase; font-weight: bold; color: white">
        Calculator
      </div>
      <div class="display">
        <label id="history"></label>

        <label id="screen">0'P.K</label>
      </div>
      <div class="calc-values">
        <button class="operator">%</button>
        <button class="col-span clear">Clear</button>
        <button class="delete"><i class="fa-solid fa-delete-left"></i></button>
        <button class="operator sq-root">&#8730;</button>
        <button class="operator cb-root">&#8731;</button>
        <button class="operator sq" data-value="^">x &#691;</button>
        <button class="operator" data-value="/">
          <i class="fa-solid fa-divide"></i>
        </button>
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator" data-value="*">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator" data-value="-">
          <i class="fa-solid fa-minus"></i>
        </button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator" data-value="+">
          <i class="fa-solid fa-plus"></i>
        </button>

        <button class="number">0</button>
        <button class="number">.</button>
        <button class="col-span equals">
          <i class="fa-solid fa-equals"></i>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
